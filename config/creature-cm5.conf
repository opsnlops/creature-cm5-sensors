# lm-sensors labels for the Creature CM5 Carrier board.
# Installed by the creature-cm5-sensors package.
#
# The PAC1954 channel labels come from the device tree overlay. The
# MCP9808 limits are set by a udev rule
# (/usr/lib/udev/rules.d/60-creature-cm5-sensors.rules).

chip "jc42-*"
    label temp1 "Board"
